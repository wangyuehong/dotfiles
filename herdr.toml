onboarding = false
[ui]
agent_panel_sort = "priority"

[theme]
name = "solarized-light"
auto_switch = false

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true

[keys]
prefix = "ctrl+q"
new_tab = "prefix+c"
split_vertical = "prefix+\\"
