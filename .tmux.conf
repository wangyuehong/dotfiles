# =============================================================================
# TMUX Configuration
# =============================================================================
# Prefix: C-a (prefix + ? for help)

# =============================================================================
# General Settings
# =============================================================================

# Terminal & Color Support
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-*:Tc"

# Extended Keys
set -g extended-keys always
set -g extended-keys-format csi-u
set -ga terminal-features ',*:extkeys'

# OSC 8 Hyperlinks (Ghostty supports them; tmux strips them unless declared)
set -ga terminal-features ',xterm*:hyperlinks'

# Kitty graphics passthrough
set -g allow-passthrough on

# Basic Settings
set -g mouse on
set -g display-time 2000
set -g history-limit 100000
set -g base-index 0
set -g pane-base-index 1
set -g default-command zsh
set -g focus-events on
set -g aggressive-resize on
set -g allow-set-title on
set -g allow-rename on

# Window Naming (friendly names via script)
# The pane count leaves out the agent sidebar; @agent-name is the session name my-agents-bar gives a Claude Code pane
set -g automatic-rename-format '#(tmux-window-name.sh #{pane_pid} #{n:#{P:#{?@agent-bar,,x}}} #{q:@agent-name})'

# Activity Monitoring
setw -g monitor-bell on
set -g visual-bell on
set -g bell-action any

# =============================================================================
# Key Bindings
# =============================================================================

# Prefix Key
# Use F12 as internal prefix (never pressed directly)
# C-a is intercepted in root table to handle IM before entering prefix mode
set -g prefix F12
unbind C-b
bind -n C-a run-shell "tmux-im.sh prefix #{pane_id}" \; switch-client -T prefix
# Send C-a to application (e.g., move to beginning of line in shell)
bind a send-keys C-a

# Session & Window Management
bind C-c new-window -c "#{pane_current_path}"
bind b last-window    # like Emacs C-x b: toggle back to the previous one
bind r source ~/.tmux.conf \; display "Configuration reloaded!"

# Pane Management
unbind '"'
unbind %
bind - splitw -v -c "#{pane_current_path}"    # vertical split
bind | splitw -h -c "#{pane_current_path}"    # horizontal split
bind "\\" splitw -h -c "#{pane_current_path}" # horizontal split

# Pane Border
set -g pane-border-status top
# pane-border-status is window-wide; the sidebar title is selected per pane.
set -g pane-border-format "#{?@agent-bar,#{@agent-bar-title}, #{?#{==:#{pane_mode},copy-mode},#[fg=brightwhite bg=red bold]#{?search_present,[#{pane_search_string}] ,}#{?search_count,(#{search_count}#{?search_count_partial,+,}) ,}[#{scroll_position}/#{history_size}]#[default] ,}#{window_id}:#{pane_id} | #{pane_title} }"

# Pane Resizing
bind -r C-k resizep -U 5    # upward
bind -r C-j resizep -D 5    # downward
bind -r C-h resizep -L 5    # left
bind -r C-l resizep -R 5    # right

# Pane Swapping
bind C-u swapp -U    # swap with previous pane
bind C-d swapp -D    # swap with next pane

# Pane Navigation (Vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Synchronize Panes
bind S set synchronize-panes

# =============================================================================
# Copy Mode (Vi-style)
# =============================================================================

set -g mode-keys vi
set -g copy-mode-position-format ""
set -g copy-mode-selection-style "bg=#375757"
set -g copy-mode-match-style "bg=#008080"
set -g copy-mode-current-match-style "bg=#e02c6d,bold"
bind Escape copy-mode
bind / copy-mode \; send-keys ?

# Copy mode key bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-g    send -X cancel

# Mouse drag behavior
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# Mouse menus stay open after release; click an item to choose
# Rewrites the current root-table display-menu bindings with -O, so the menus follow tmux's defaults
run 'tmux list-keys -T root | sed -n "/display-menu/s/display-menu \(-O \)*/display-menu -O /gp" | tmux source -'

# Option+click: open the path or URL under the mouse (paths open in a popup on the clicking client)
# The press records the click and the release opens it: a popup opened on the press receives the release
# Quick repeated presses arrive as second and triple clicks, so they record like a press
# The tmux-open table holds the gesture, so the pane receives none of it and a release without an Option press opens nothing
# Events between press and release stay in the table: drags over panes, borders and the status line, and the double click a held second press becomes
# A drag into a pane to the right arrives as an unbindable key, which ends the gesture without opening
# A release after moving is a drag end and opens the pressed target too, so the release reads only what the press recorded
# Free-form text goes through options: #{q:} leaves { } , ~ unescaped, so /bin/sh would expand them
%hidden TMUX_OPEN_PRESS='set -gF @tmux-open-pane "#{pane_id}" ; set -gF @tmux-open-cwd "#{pane_current_path}" ; set -gF @tmux-open-x "#{mouse_x}" ; set -gF @tmux-open-line "#{mouse_line}" ; set -gF @tmux-open-link "#{mouse_hyperlink}" ; switch-client -T tmux-open'
bind -n M-MouseDown1Pane "$TMUX_OPEN_PRESS"
bind -n M-SecondClick1Pane "$TMUX_OPEN_PRESS"
bind -n M-TripleClick1Pane "$TMUX_OPEN_PRESS"
bind -T tmux-open M-MouseDrag1Pane switch-client -T tmux-open
bind -T tmux-open M-MouseDrag1Border switch-client -T tmux-open
bind -T tmux-open M-MouseDrag1Status switch-client -T tmux-open
bind -T tmux-open M-MouseDrag1StatusLeft switch-client -T tmux-open
bind -T tmux-open M-MouseDrag1StatusRight switch-client -T tmux-open
bind -T tmux-open M-MouseDrag1StatusDefault switch-client -T tmux-open
bind -T tmux-open M-DoubleClick1Pane switch-client -T tmux-open
bind -T tmux-open M-MouseUp1Pane run-shell -E 'tmux-open.sh #{q:client_name} "$(tmux show -gv @tmux-open-pane)" "$(tmux show -gv @tmux-open-cwd)" "$(tmux show -gv @tmux-open-x)" "$(tmux show -gv @tmux-open-line)" "$(tmux show -gv @tmux-open-link)"'
bind -T tmux-open M-MouseDragEnd1Pane run-shell -E 'tmux-open.sh #{q:client_name} "$(tmux show -gv @tmux-open-pane)" "$(tmux show -gv @tmux-open-cwd)" "$(tmux show -gv @tmux-open-x)" "$(tmux show -gv @tmux-open-line)" "$(tmux show -gv @tmux-open-link)"'

# =============================================================================
# Visual & Status Bar
# =============================================================================

# Window Status
set-window-option -g window-status-current-style 'fg=terminal bold underscore,bg=brightred'
# my-agents-bar writes @agent-alert: the window name in bold and a red bold ! after it for a blocked agent,
# • for a turn that ended unseen. A window without one keeps tmux's plain ! for its bell; the mark replaces that flag.
set-window-option -g window-status-bell-style default
set-window-option -g window-status-format '#{?#{@agent-alert},#[bold]#I:#W#[fg=red bold]#{?#{==:#{@agent-alert},blocked},!,•}#[default]#{s/!//:window_flags},#I:#W#{window_flags}}'
set-window-option -g window-status-current-format '#{?#{@agent-alert},#[bold]#I:#W#[fg=red bold]#{?#{==:#{@agent-alert},blocked},!,•}#[default]#{s/!//:window_flags},#I:#W#{window_flags}}'


# Pane Borders
set -g pane-border-lines heavy
# IM-aware border: use @im-color if set, otherwise default to brightmagenta
set -g pane-active-border-style "#{?#{@im-color},fg=#{@im-color},fg=brightmagenta}"

# Cursor
set -g cursor-colour "#ebcb8b"

# Status Bar
set -g status-interval 1
set -g status-left "#{?pane_synchronized,#[bg=blue],}[#S]#[bg=default]|"
set -g status-right "#(tmux-mem-cpu-load -g 0 -a 2 -i 2)"

# =============================================================================
# Plugins
# =============================================================================

# Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# Navigation
set -g @plugin 'ddzero2c/tmux-easymotion'
set -g @easymotion-key 's'
bind -T copy-mode-vi s run-shell "~/.tmux/plugins/tmux-easymotion/mode-s.sh"

# Search
set -g @plugin 'roosta/tmux-fuzzback'
set -g @fuzzback-bind f
set -g @fuzzback-hide-preview 1

bind C-f display-popup -E "tmux-fzf.sh"

# =============================================================================
# Input Method Management
# =============================================================================
# IM border is synced by tmux-im.sh (called from Hammerspoon on IM change)
set-hook -g pane-focus-in 'run-shell "tmux-im.sh focus-in #{pane_id}"'
set-hook -g pane-mode-changed 'run-shell "tmux-im.sh mode-changed #{pane_id} #{pane_mode}"'

# =============================================================================
# Agent Sidebar
# =============================================================================
# my-agents-bar decides everything; tmux only wires events to it
# Without my-agents-bar in PATH every call is skipped, and a call exits 0 when its target has already gone,
# so a hook never opens a view-mode
# pane-focus-in is appended (-ga) after the tmux-im hook above
set-hook -g window-linked 'run-shell "command -v my-agents-bar >/dev/null || exit 0; my-agents-bar ensure #{hook_window}"'
set-hook -g window-resized 'run-shell "command -v my-agents-bar >/dev/null || exit 0; my-agents-bar ensure #{hook_window}"'
set-hook -g pane-bell 'run-shell "command -v my-agents-bar >/dev/null || exit 0; my-agents-bar bell #{hook_pane}"'
set-hook -ga pane-focus-in 'run-shell "command -v my-agents-bar >/dev/null || exit 0; my-agents-bar focus #{pane_id}"'
# A sidebar that becomes visible refreshes at once
set-hook -g session-window-changed 'run-shell "command -v my-agents-bar >/dev/null || exit 0; my-agents-bar wake"'
set-hook -g client-session-changed 'run-shell "command -v my-agents-bar >/dev/null || exit 0; my-agents-bar wake"'
set-hook -g client-attached 'run-shell "command -v my-agents-bar >/dev/null || exit 0; my-agents-bar wake"'
# The end of a drag on a pane border: the width of the sidebar is remembered for every sidebar
bind -n MouseDragEnd1Border run-shell "command -v my-agents-bar >/dev/null || exit 0; my-agents-bar dragged #{pane_id}"
# Next pane without stopping on the sidebar; tmux's own prefix + o without my-agents-bar
bind o if-shell 'command -v my-agents-bar >/dev/null' "run-shell 'my-agents-bar next #{pane_id}'" 'select-pane -t :.+'
# The numbered agent picker in a popup; nothing without my-agents-bar
# run-shell shows only stdout, so the error goes there too
bind e if-shell 'command -v my-agents-bar >/dev/null' "run-shell -b 'my-agents-bar popup #{q:client_name} 2>&1'"
# A click on the sidebar switches this client to the agent and leaves the focus alone; elsewhere tmux's default
bind -n MouseDown1Pane if -Ft= '#{@agent-bar}' 'run-shell "my-agents-bar click #{q:client_name} #{pane_id} #{mouse_y}"' 'select-pane -t = ; send-keys -M'
run -b 'command -v my-agents-bar >/dev/null || exit 0; my-agents-bar ensure --all'

# =============================================================================
# Local Configuration
# =============================================================================

if-shell "[ -f ~/.tmux.conf.local ]" 'source ~/.tmux.conf.local'

# Initialize TPM (must be at the end)
run '~/.tmux/plugins/tpm/tpm'
